---
# Read the Docs builds the Docusaurus site. READTHEDOCS_CANONICAL_URL (set by Read the Docs)
# gives docusaurus.config.ts the per-version base URL, e.g. /en/latest/.
version: 2
build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"
    nodejs: "22"
  commands:
    - pip install uv
    - uv sync --locked --no-default-groups --group docs
    - uv run --no-sync python docs/generate.py
    - npm --prefix docs ci
    - npm --prefix docs run build -- --out-dir "$READTHEDOCS_OUTPUT/html"
