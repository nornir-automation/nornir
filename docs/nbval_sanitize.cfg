[regex1]
regex: \r\n
replace: \n

[regex2]
regex: File ".*task.py".
replace: File "nornir/nornir/core/task.py"

[regex3]
regex: File "[\w\d/]*.py", line
replace: File "/tmp/ipykernel_random.py", line

# Py3.11 adds "^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^" to the traceback output
[regex4]
regex: \n\s*\^*\n
replace: \n
# Paths under a home directory may contain characters regex3 does not match
# (for example a hyphenated worktree name); normalise them the same way.
[regex5]
regex: File "/home/[^"]*\.py", line
replace: File "/tmp/ipykernel_random.py", line
