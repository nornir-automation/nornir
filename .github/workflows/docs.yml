---
name: docs
# yamllint disable rule:truthy

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect which files have changed so the docs jobs only run when they can be affected
  files-changed:
    name: Detect file changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation: ${{ steps.changes.outputs.documentation }}
      markdown: ${{ steps.changes.outputs.markdown }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: .github/file-filters.yml

  markdown-lint:
    name: Lint documentation Markdown
    if: needs.files-changed.outputs.markdown == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      # Generated pages (*.ipynb.md, api/) do not exist yet at this point, so only
      # hand-written pages are linted
      - name: Run markdownlint
        run: npx --yes markdownlint-cli@0.49.1 "docs/docs/**/*.{md,mdx}"

  documentation:
    name: Build documentation
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.files-changed.outputs.documentation == 'true'
    needs: ["files-changed", "markdown-lint"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install Python dependencies
        run: uv sync --locked
      # Renders the notebooks and the API reference, then runs `docusaurus build`, which
      # fails on any broken link or anchor
      - name: Build documentation
        run: make docs
      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/build
          retention-days: 7
