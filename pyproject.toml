[project]
name = "nornir"
version = "3.6.0"
description = "Pluggable multi-threaded framework with inventory management to help operate collections of devices"
authors = [{ name = "David Barroso", email = "dbarrosop@dravetech.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ruamel.yaml>=0.17",
]

[project.urls]
Repository = "https://github.com/nornir-automation/nornir"

[project.entry-points."nornir.plugins.runners"]
serial = "nornir.plugins.runners:SerialRunner"
threaded = "nornir.plugins.runners:ThreadedRunner"

[project.entry-points."nornir.plugins.inventory"]
SimpleInventory = "nornir.plugins.inventory.simple:SimpleInventory"

[dependency-groups]
dev = [
    "decorator",
    "nbval>=0.10.0,<0.11",
    "pytest",
    "pytest-cov",
    "requests-mock",
    "mypy>=1.5.1,<2",
    "nornir-jinja2==0.2.0",
    "nornir-utils==0.2.0",
    "napalm>=5.2.0",
    "nornir-napalm==0.5.0",
    "ruff>=0.15.20,<0.16",
]
docs = [
    "sphinx==6.2.1",
    "sphinx-rtd-theme==1.2.2",
    "sphinxcontrib-napoleon>=0.7,<0.8",
    "jupyter==1.0.0",
    "nbsphinx==0.9.2",
    "pygments==2.20.0",
    "sphinx-issues==3.0.1",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.build-backend]
module-root = ""

[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = true
strict_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tests.conftest"
disable_error_code = [
    "return-value",
]

[[tool.mypy.overrides]]
module = "tests.core.test_InitNornir"
disable_error_code = [
    "arg-type",
]

[[tool.mypy.overrides]]
module = "tests.core.test_filter"
disable_error_code = [
    "arg-type",
    "assignment",
    "operator"
]

[[tool.mypy.overrides]]
module = "tests.core.test_inventory"
disable_error_code = [
    "arg-type",
    "index"
]

[[tool.mypy.overrides]]
module = "tests.wrapper"
disable_error_code = [
    "import-untyped",
    "misc",
    "no-any-return"
]


[tool.ruff]
line-length = 100
# Notebooks are rendered documentation examples (prints, incremental imports, etc.) and were
# not linted before ruff 0.6 started picking up .ipynb files by default
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
preview = true

select = [ "ALL" ]

ignore = [
    "CPY001",  # Missing copyright notice at top of file
    "D203",    # Incompatible with D211 (no-blank-line-before-class), which we keep
    "D213",    # Incompatible with D212 (multi-line-summary-first-line), which we keep
    "ISC001",  # Recommended to be disabled when used with ruff formatter
    "N801",    # Class name should use CapWords convention
    "N818",    # Exception name should be named with an Error suffix

##################################################################################################
# The ignored rules below should be removed once the code has been updated, they are included    #
# like this so that we can reactivate them one by one. Alternatively ignored after further       #
# investigation if they are deemed to not make sense.                                            #
##################################################################################################
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "ARG002",  # Unused method argument
    "B028",    # No explicit `stacklevel` keyword argument found
    "COM812",  # Trailing comma missing
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in `__init__`
    "EM101",   # [*] Exception must not use a string literal, assign to variable first (unsafe fix)
    "EM102",   # [*] Exception must not use an f-string literal, assign to variable first (unsafe fix)
    "FBT001",  # Boolean-typed positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "FURB189", # Subclassing `dict`/`list` should be replaced by `collections.UserDict`/`UserList` (would change behaviour)
    "INP001",  # File is part of an implicit namespace package. Add an `__init__.py`.
    "PERF203", # `try`-`except` within a loop incurs performance overhead
    "PIE800",  # Unnecessary spread `**`
    "PLC2801", # Unnecessary dunder call to `__getattribute__`. Access attribute directly or use getattr built-in function
    "PLR6201", # Use a `set` literal when testing for membership
    "PLR6301", # Method `run` could be a function, class method, or static method
    "PLW1641", # Object does not implement `__hash__` method
    "PYI034",  # `__enter__` should return `Self`; requires Python 3.11+ (or typing_extensions)
    "RSE102",  # Unnecessary parentheses on raised exception
    "RUF001",  # String contains ambiguous `–` (EN DASH). Did you mean `-` (HYPHEN-MINUS)?
    "RUF067",  # `__init__` module should only contain docstrings and re-exports
    "S701",    # By default, jinja2 sets `autoescape` to `False`. Consider using `autoescape=True` or the `select_autoescape` function to mitigate XSS vulnerabilities.
    "SLF001",  # Private member accessed
    "TC001",   # Move application import into a type-checking block (first-party re-export restructuring is out of scope for the PEP 585/604 cleanup)
    "TRY002",  # Create your own exception
    "TRY003",  # Avoid specifying long messages outside the exception class
    "TRY004",  # Prefer `TypeError` exception for invalid type
    "UP034",   # Avoid extraneous parentheses
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.ruff.lint.pylint]
max-args = 11
max-branches = 16
max-positional-args = 10
max-public-methods = 22
max-returns = 11

[tool.ruff.lint.per-file-ignores]

"docs/conf.py" = [
    "A001",   # Variable `copyright` is shadowing a Python builtin
    "ERA001", # Commented out code, used to provide examples for Sphinx docs
]

"docs/highlighter.py" = [
    "FURB101", # `open` and `read` should be replaced by `Path(filename).read_text()`
    "PLW1514", # `open` in text mode without explicit `encoding` argument
]

"nornir/**.py" = [
##################################################################################################
# The ignored rules below should be removed once the code has been updated, they are included    #
# like this so that we can reactivate them one by one. Alternatively ignored after further       #
# investigation if they are deemed to not make sense.                                            #
##################################################################################################
    "D105",    # Missing docstring in magic method
    "D106",    # Missing docstring in public nested class
    "DOC502",  # Raised exception is not explicitly raised
    "EM103",   # [*] Exception must not use a `.format()` string directly, assign to variable first (unsafe fix)
]

"nornir/core/configuration.py" = [
    "A002",    # Argument `format` / `help` is shadowing a Python builtin
]

"nornir/core/plugins/register.py" = [
##################################################################################################
# The ignored rules below should be removed once the code has been updated, they are included    #
# like this so that we can reactivate them one by one. Alternatively ignored after further       #
# investigation if they are deemed to not make sense.                                            #
##################################################################################################
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar` (every fix changes behaviour)
]

"nornir/core/task.py" = [
    "BLE001",  # Do not catch blind exception: `Exception`
]

"nornir/init_nornir.py" = [
    "N802",    # Function name `InitNornir` should be lowercase
]

"tests/**.py" = [
    "BLE001", # Do not catch blind exception: `Exception`
    "N802",   # Function name should be lowercase
    "S101",   # Use of assert detected
    "S105",   # Possible hardcoded password assigned

##################################################################################################
# The ignored rules below should be removed once the code has been updated, they are included    #
# like this so that we can reactivate them one by one. Alternatively ignored after further       #
# investigation if they are deemed to not make sense.                                            #
##################################################################################################
    "ARG001",  # Unused function argument
    "DTZ005",  # `datetime.datetime.now()` called without a `tz` argument
    "FURB101", # `open` and `read` should be replaced by `Path(filename).read_text()`
    "LOG009",  # Use of undocumented `logging.WARN` constant
    "N999",    # Invalid module name
    "PLC1901", # Can be simplified as an empty string is falsey
    "PLR0904", # Too many public methods
    "PLR2004", # Magic value used in comparison, consider replacing with a constant variable
    "PLW1514", # `open` in text mode without explicit `encoding` argument
    "SIM118",  # Use `key in dict` instead of `key in dict.keys()`
    "UP032",   # Use f-string instead of `format` call
]

[tool.pytest]
# addopts = ["--cov=nornir", "--cov-report=term-missing", "-vs"]
filterwarnings = [
    "ignore::nornir.core.exceptions.ConflictingConfigurationWarning",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
