schema_version: "1.0"
workflow:
  id: "implement-phased"
  name: "Phased implementation with validation loop"
  version: "1.2.0"
  author: "nornir maintainers"
  description: >-
    Executes tasks.md one '## Phase' group at a time. Each group is implemented by a
    fresh agent, then checked by the repository gates and an independent judge agent;
    failing rounds get a fix agent, up to max_rounds, before the next group starts.
    Ends with a whole-diff review, the full gate, and a committed report.

requires:
  speckit_version: ">=1.0.3"
  integrations:
    any:
      - "claude"

inputs:
  spec_dir:
    type: string
    default: ""
    prompt: "Spec directory (e.g. specs/001-asyncio-runner); empty picks the current feature"
  max_rounds:
    type: number
    default: 3
    prompt: "Validation rounds per group before it is declared blocked (1-5)"
  guidance:
    type: string
    default: ""
    prompt: "Optional implementation guidance forwarded to every implement agent"
  plan_verdict:
    type: string
    enum: ["", approve, reject]
    default: ""
    prompt: "Pre-decide the group-plan gate (approve) for unattended runs; empty prompts"
  blocked_verdict:
    type: string
    enum: ["", continue, abort]
    default: ""
    prompt: "Pre-decide the blocked-group gate for unattended runs; empty prompts"
  model:
    type: string
    default: "opus"
    prompt: "Claude model for every agent step, passed as --model (e.g. opus, sonnet)"

steps:
  # ---------------------------------------------------------------- preflight
  - id: preflight
    type: shell
    run: uv run --no-sync python "{{ context.workflow_dir }}/phased.py" preflight "{{ context.run_id }}"
    output_format: json
    timeout: 120

  - id: preflight-failed
    type: if
    condition: "{{ steps.preflight.output.data.ok != true }}"
    then:
      - id: preflight-stop
        type: gate
        message: "Preflight stopped the run: {{ steps.preflight.output.data.error }} Details below; fix the problem and start the workflow again."
        show_file: "{{ steps.preflight.output.data.error_file }}"
        options: [abort]
        on_reject: abort

  - id: plan-review
    type: gate
    message: "Review the group plan (below). approve starts the implementation loop; reject aborts."
    show_file: "{{ steps.preflight.output.data.overview }}"
    options: [approve, reject]
    on_reject: abort
    verdict_input: plan_verdict

  # ------------------------------------------------------------- group loop
  - id: groups
    type: do-while
    condition: "{{ steps.select-group.output.data.found }}"
    max_iterations: 40
    steps:
      - id: select-group
        type: shell
        run: uv run --no-sync python "{{ context.workflow_dir }}/phased.py" select "{{ context.run_id }}"
        output_format: json
        timeout: 120

      - id: run-group
        type: if
        condition: "{{ steps.select-group.output.data.found }}"
        then:
          # ------------------------------------------------------ implement
          - id: implement
            type: shell
            run: uv run --no-sync python "{{ context.workflow_dir }}/phased.py" agent implement "{{ context.run_id }}"
            output_format: json
            timeout: 10900

          # ------------------------------------------------ validation loop
          - id: validate
            type: do-while
            condition: "{{ steps.check.output.data.retry }}"
            max_iterations: 5
            steps:
              - id: gates
                type: shell
                run: uv run --no-sync python "{{ context.workflow_dir }}/phased.py" gates "{{ context.run_id }}"
                output_format: json
                timeout: 3600

              - id: judge
                type: if
                condition: "{{ steps.gates.output.data.passed }}"
                then:
                  - id: judge-run
                    type: shell
                    run: uv run --no-sync python "{{ context.workflow_dir }}/phased.py" agent judge "{{ context.run_id }}"
                    output_format: json
                    timeout: 1900

              - id: check
                type: shell
                run: uv run --no-sync python "{{ context.workflow_dir }}/phased.py" check "{{ context.run_id }}"
                output_format: json
                timeout: 120

              - id: fix
                type: if
                condition: "{{ steps.check.output.data.retry }}"
                then:
                  - id: fix-run
                    type: shell
                    run: uv run --no-sync python "{{ context.workflow_dir }}/phased.py" agent fix "{{ context.run_id }}"
                    output_format: json
                    timeout: 7300

          # --------------------------------------------------- blocked group
          - id: blocked
            type: if
            condition: "{{ steps.check.output.data.passed != true }}"
            then:
              - id: blocked-gate
                type: gate
                message: "Group '{{ steps.check.output.data.heading }}' still fails after {{ steps.check.output.data.round }} validation round(s). continue = leave it blocked and move on; abort = stop the run."
                show_file: "{{ steps.check.output.data.findings }}"
                options: [continue, abort]
                on_reject: abort
                verdict_input: blocked_verdict

  # ------------------------------------------------------------ whole-diff tail
  - id: review
    type: shell
    run: uv run --no-sync python "{{ context.workflow_dir }}/phased.py" agent review "{{ context.run_id }}"
    output_format: json
    timeout: 3700

  - id: final-gates
    type: shell
    run: uv run --no-sync python "{{ context.workflow_dir }}/phased.py" final "{{ context.run_id }}"
    output_format: json
    timeout: 4000

  - id: summary
    type: shell
    run: uv run --no-sync python "{{ context.workflow_dir }}/phased.py" summary "{{ context.run_id }}"
    output_format: json
    timeout: 120

  - id: report
    type: shell
    run: uv run --no-sync python "{{ context.workflow_dir }}/phased.py" agent report "{{ context.run_id }}"
    output_format: json
    timeout: 1900
